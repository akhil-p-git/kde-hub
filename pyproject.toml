[project]
name = "kde-hub"
version = "0.1.0"
description = "System monitor hub for the KDE system tray (PySide6)"
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials>=6.7", "psutil>=6.0"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
kde-hub = "kdehub.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kdehub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
